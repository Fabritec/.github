name: Lead Intel — nightly sheet sync

# The shared Google Sheet is a view of the database, rebuilt once a night.
# Nobody should edit that sheet directly: this job replaces its contents.
#
# Until the repository secrets below are set, the job exits early rather than
# failing every night.

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lead-intel

    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        id: check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$GOOGLE_SHEETS_SPREADSHEET_ID" ]; then
            echo "Secrets not configured yet — skipping sync."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.configured == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lead-intel/package-lock.json

      - name: Install dependencies
        if: steps.check.outputs.configured == 'true'
        run: npm ci

      - name: Sync to Google Sheets
        if: steps.check.outputs.configured == 'true'
        run: npm run sync:sheets
        env:
          LEAD_STORE_DRIVER: supabase
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
